name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Compile all modules
        run: python -m py_compile jira_export.py jira_export_extras.py jira_export_jpd.py jira_export_admin.py jira_endpoints.py jira_seed.py
      - name: Unit tests (offline)
        run: pytest -q
